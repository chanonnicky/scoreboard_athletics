###############################################################################
# CG Live - RTMP relay (contribution link) config for MediaMTX
#
# Flow:  OBS (at venue) --RTMP--> THIS box (MediaMTX) --RTMP/SRT--> broadcast room
#        (broadcast room composites the /live CG overlay and airs it)
#
# This file is used only by the relay. The CG server (server.ps1 / server.py)
# does NOT read it and is not involved in video at all.
#
# Get the binaries once:   powershell -ExecutionPolicy Bypass -File get-relay.ps1
# Then start.bat / start.sh launch this alongside the CG server.
#
# >>> BEFORE THE EVENT, EDIT:  (1) the publish password  (2) the runOnAvailable
# >>> destination URL  (3) optionally flip record: to true                     <<<
###############################################################################

logLevel: info
logDestinations: [stdout]

# Control API - localhost only (used for a status check, never exposed)
api: true
apiAddress: 127.0.0.1:9997

# Only the RTMP ingest listener is public. Everything else is off to keep the
# attack surface minimal on a box with a public IP.
rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"
rtsp: false
hls: false
webrtc: false
srt: false
moq: false

# --- Auth -------------------------------------------------------------------
# "publish" = the only account allowed to push a stream in (from OBS).
# "any" from 127.0.0.1 = the local ffmpeg egress reader + the status API.
authInternalUsers:
  - user: publish
    pass: CHANGE_ME_PUBLISH_PASSWORD          # EDIT: set a real password
    ips: []
    permissions:
      - action: publish
        path: live
  - user: any
    pass:
    ips: [127.0.0.1, "::1"]
    permissions:
      - action: read
      - action: playback
      - action: api
      - action: metrics

# --- The single ingest path ----------------------------------------------------
paths:
  live:
    # When OBS connects, push the stream on to the broadcast room, no re-encode
    # (-c copy = passthrough = lowest latency + ~0 CPU). Restarts itself if the
    # push drops while OBS is still live.
    #
    # EDIT the destination URL at the end of this line:
    #   RTMP:  ... -c copy -f flv     rtmp://ROOM_HOST/app/streamkey
    #   SRT :  ... -c copy -f mpegts  srt://ROOM_HOST:9000?streamid=KEY&latency=200000
    # (command is run directly, NOT via a shell: no pipes, no quotes, no env vars)
    runOnAvailable: bin/ffmpeg/ffmpeg.exe -nostdin -hide_banner -loglevel warning -i rtmp://127.0.0.1:1935/live -c copy -f flv rtmp://EDIT_ROOM_HOST/live/EDIT_STREAM_KEY
    runOnAvailableRestart: true

    # Local backup recording. Flip to "true" to record every ingested stream to
    # data/rec/ (~3.6 GB per hour at 8 Mbps). data/rec/ is gitignored.
    record: false
    recordPath: data/rec/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordSegmentDuration: 1h
