<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/pictures/favicon.png">
  <title>CG Live — OBS dock</title>
  <link rel="stylesheet" href="/control.css">
  <style>
    /* dock ของ OBS กว้างประมาณ 320–420px — เลย์เอาต์คอลัมน์เดียว ปุ่มใหญ่ แตะง่าย
       (control.css ให้ token สี + .btn + .field มาแล้ว ที่นี่แค่จัดวางใหม่ให้แคบ) */
    body { margin: 0; }
    .dock { padding: 8px 8px 16px; max-width: 560px; margin: 0 auto; }
    .dock-top {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 6px 2px 8px; background: var(--bg);
      border-bottom: 1px solid var(--stroke); margin-bottom: 8px;
    }
    .dock-top .d-brand { font-size: 13px; font-weight: 700; }
    .dock-top .d-conn { font-size: 11px; margin-left: auto; }
    .d-conn.ok { color: var(--ok); }
    .d-conn.bad { color: var(--danger); }
    .d-sec { font-size: 11px; font-weight: 700; letter-spacing: .4px;
             color: var(--ink-dim); text-transform: uppercase; margin: 12px 2px 5px; }
    /* แถบสถานะ 5 ช่อง */
    .d-slots { display: flex; flex-direction: column; gap: 4px; }
    .d-slot {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-radius: 8px; font-size: 12px;
      background: var(--bg-3); border: 1px solid var(--stroke);
    }
    .d-slot.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--bg-3)); }
    .d-slot-n { flex: none; width: 74px; font-weight: 700; color: var(--ink-dim); }
    .d-slot.on .d-slot-n { color: var(--ink); }
    .d-slot-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-slot .btn { padding: 2px 7px; font-size: 12px; }
    /* ปุ่มชิ้นงาน */
    .d-items { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .d-item {
      display: flex; flex-direction: column; gap: 2px; text-align: left;
      padding: 7px 9px; min-height: 48px; cursor: pointer; font: inherit;
      background: var(--bg-3); color: var(--ink);
      border: 1px solid var(--stroke); border-radius: 8px;
    }
    .d-item:hover { border-color: var(--accent); }
    .d-item.is-live { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--bg-3)); }
    .d-item-tag { font-size: 10px; font-weight: 700; color: var(--ink-dim); }
    .d-item-n { font-size: 12px; font-weight: 600; line-height: 1.2;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-grp-t { font-size: 10px; font-weight: 700; color: var(--ink-dim);
               margin: 8px 2px 4px; text-transform: uppercase; }
    /* คอมโพสด่วน */
    .d-quick { display: flex; flex-direction: column; gap: 5px; }
    .d-quick input { width: 100%; font-size: 13px; padding: 7px 9px; }
    .d-row { display: flex; gap: 5px; }
    .d-row .btn { flex: 1; }
    .d-tok { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-dim); }
    .d-tok input { flex: 1; font-size: 12px; padding: 5px 7px; }
    .d-hint { font-size: 11px; color: var(--ink-dim); line-height: 1.45; margin: 6px 2px 0; }
    @media (max-width: 330px) { .d-items { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="dock">
    <div class="dock-top">
      <span class="d-brand">🎬 CG Live</span>
      <button class="btn danger sm" data-act="hide-all">■ ลงทั้งหมด</button>
      <button class="btn sm" data-act="hide-main">■ หลัก</button>
      <span class="d-conn" id="conn">…</span>
    </div>
    <div id="dockBody"><p class="muted">กำลังโหลด…</p></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/templates.js"></script>
  <script src="/obs.js"></script>
</body>
</html>
