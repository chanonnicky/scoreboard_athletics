<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CG Live — คอนโทรล</title>
  <link rel="stylesheet" href="/control.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">🏃 CG Live <span>กีฬาสี</span></div>
      <nav class="sb-nav" id="sbNav">
        <div class="sb-group">
          <div class="sb-group-t">ควบคุม</div>
          <a class="sb-item" data-nav href="/control">🎛️ คุม Live</a>
        </div>
        <div class="sb-group">
          <div class="sb-group-t">จดคะแนน</div>
          <a class="sb-item" data-nav href="/score">🏃 กรีฑา</a>
          <span id="sbScoreSports"></span>
        </div>
        <div class="sb-group">
          <div class="sb-group-t">จัดการ</div>
          <a class="sb-item" data-nav href="/control#events">📋 รายการแข่ง</a>
          <a class="sb-item" data-nav href="/control#import">📥 นำเข้า</a>
          <a class="sb-item" data-nav href="/control#settings">⚙️ ตั้งค่า</a>
        </div>
        <div class="sb-group">
          <div class="sb-group-t">เปิดจอ</div>
          <a class="sb-item" href="/live" target="_blank">📺 จอ Live (OBS)</a>
          <a class="sb-item" href="/scoreboard?view=all" target="_blank">🏆 Scoreboard รวม</a>
          <span id="sbBoardSports"></span>
        </div>
      </nav>
    </aside>
    <div class="sb-backdrop" id="sbBackdrop"></div>

    <div class="app-main">
      <header class="topbar">
        <button class="sb-toggle" id="sbToggle" type="button" aria-label="เมนู">☰</button>
        <div class="brand">🏃 CG Live <span>กีฬาสี</span></div>
        <div class="onair-status" id="onairStatus"></div>
        <div class="conn" id="conn">…</div>
        <label class="tok">
          token
          <input type="password" id="token" placeholder="(ถ้าตั้งไว้)" autocomplete="off">
        </label>
      </header>

      <main id="panel"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/templates.js"></script>
  <script src="/control.js"></script>
</body>
</html>
